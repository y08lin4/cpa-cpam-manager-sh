name: static-checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: 执行项目静态检查
        run: bash scripts/check.sh
